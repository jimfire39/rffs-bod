<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur Fiches Incendie — RFFS BOD</title>
<style>
:root{
  --navy:#002F5F;--navy-l:#1a4a80;--orange:#E8500A;--orange-l:#ff6a20;
  --red:#C00000;--green:#2d6a2d;--amber:#E36C09;--gray:#595959;
  --lgray:#f5f5f5;--lblue:#D6E4F7;--border:#ddd;--text:#1a1a1a;--text-m:#666;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef2f7;color:var(--text);min-height:100vh;}

/* HEADER */
.app-header{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.hdr-inner{max-width:1260px;margin:0 auto;display:flex;align-items:stretch;}
.hdr-brand{padding:13px 22px;display:flex;flex-direction:column;justify-content:center;}
.hdr-brand h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;}
.hdr-brand span{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;}
.hdr-badge{background:var(--orange);padding:13px 20px;margin-left:auto;display:flex;align-items:center;gap:14px;}
.hdr-badge span{font-size:11px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;}
.btn-home{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;}
.btn-home:hover{background:rgba(255,255,255,.25);}

/* LAYOUT */
.app-body{max-width:1260px;margin:0 auto;padding:20px 14px;display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start;}

/* PANEL */
.panel{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;position:sticky;top:64px;}
.panel-title{background:var(--navy);padding:11px 17px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.8px;text-transform:uppercase;}
.panel-body{padding:16px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.fg select,.fg input[type=number],.fg input[type=text]{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:#fff;transition:border-color .2s;appearance:none;}
.fg select:focus,.fg input:focus{outline:none;border-color:var(--navy);}
.sw{position:relative;}
.sw::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none;font-size:11px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tg{display:flex;border:1.5px solid var(--border);border-radius:7px;overflow:hidden;}
.tg input{display:none;}
.tg label{flex:1;padding:7px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--gray);cursor:pointer;transition:all .2s;margin:0;text-transform:none;letter-spacing:0;border:none;}
.tg input:checked+label{background:var(--navy);color:#fff;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.btn-gen{width:100%;padding:11px;background:var(--orange);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;}
.btn-gen:hover{background:var(--orange-l);}
.btn-gen:active{transform:scale(.98);}
.btn-sec{width:100%;padding:8px;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:7px;}
.btn-sec:hover{background:var(--navy);color:#fff;}
.badge-vpi{display:inline-block;background:#7a2d00;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;}
.badge-vim{display:inline-block;background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;}

/* FICHE WRAP */
.fiche-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;}
.placeholder{padding:70px 30px;text-align:center;color:var(--text-m);}
.placeholder .ico{font-size:44px;margin-bottom:14px;opacity:.2;}
.placeholder h3{font-size:17px;font-weight:500;margin-bottom:6px;color:var(--gray);}
.placeholder p{font-size:13px;}

/* FICHE HEADER */
.fiche-hdr{display:grid;grid-template-columns:1fr auto;}
.fhdr-l{background:var(--navy);padding:12px 18px;}
.fhdr-l h2{font-size:13px;font-weight:700;color:#fff;}
.fhdr-l span{font-size:10px;color:rgba(255,255,255,.5);display:block;margin-top:2px;}
.fhdr-r{background:var(--orange);padding:12px 18px;display:flex;align-items:center;}
.fhdr-r span{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}

/* FICHE BODY */
.fiche-body{padding:15px;}
.id-t{width:100%;border-collapse:collapse;margin-bottom:13px;font-size:12px;}
.id-t td{padding:5px 8px;border:1px solid #ccc;}
.lbl{background:#f0f0f0;font-weight:600;color:var(--gray);font-size:10px;text-transform:uppercase;white-space:nowrap;}
.vm{font-weight:700;color:var(--navy);font-size:13px;}
.shdr{padding:6px 12px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.7px;text-transform:uppercase;margin:12px 0 7px;border-radius:4px;}
.shdr.nv{background:var(--navy)}.shdr.gy{background:var(--gray)}.shdr.or{background:var(--orange);}.shdr.rd{background:var(--red);}
.abox{border:2px solid var(--amber);background:#fffbe6;border-radius:7px;padding:11px 13px;margin-bottom:8px;}
.abox p{font-size:12px;line-height:1.6;margin-bottom:2px;}
.abox .bd{font-weight:700}.abox .it{font-style:italic;}
.qbox{font-size:11px;color:var(--gray);margin-bottom:13px;font-style:italic;padding:7px 11px;background:var(--lgray);border-radius:5px;border-left:3px solid var(--navy);}
.qbox strong{color:var(--navy);font-style:normal;}
.st{width:100%;border-collapse:collapse;margin-bottom:13px;font-size:12px;}
.st td{border:1px solid #ccc;vertical-align:top;}
.sl{width:28px;text-align:center;font-size:18px;font-weight:800;color:#fff;padding:9px 4px;}
.slb{width:75px;font-size:10px;font-weight:700;padding:7px;background:var(--lgray);text-transform:uppercase;letter-spacing:.5px;}
.sc{padding:8px 10px;line-height:1.6;}
.ss{background:var(--navy)}.si{background:var(--orange)}.sm{background:var(--red)}.ssec{background:var(--green)}.svpi{background:#7a2d00;}
.ssl{color:var(--navy)}.sil{color:var(--orange)}.sml{color:var(--red)}.ssecl{color:var(--green)}.svpil{color:#7a2d00;}
.dt{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:12px;}
.dt th{background:var(--navy);color:#fff;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--navy);text-align:left;}
.dt td{padding:6px 8px;border:1px solid #ccc;vertical-align:top;}
.dt tr:nth-child(even) td{background:var(--lgray);}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px;}
.tc{border:1px solid #ddd;border-radius:7px;padding:9px;background:var(--lgray);font-size:11px;}
.tc h4{font-size:11px;font-weight:700;margin-bottom:5px;}
.tc ul{list-style:none;padding:0;}
.tc ul li{padding:2px 0;color:var(--text-m);line-height:1.5;}
.tc ul li::before{content:'› ';color:var(--navy);}
.fiche-footer{border-top:1px solid var(--border);padding:7px 16px;font-size:10px;color:var(--text-m);display:flex;justify-content:space-between;background:var(--lgray);}

/* ALERTE SPÉCIALE VÉH ÉLECTRIQUE */
.elec-warn{border:2px solid var(--red);background:#fff0f0;border-radius:7px;padding:10px 13px;margin-bottom:10px;}
.elec-warn p{font-size:12px;line-height:1.6;margin-bottom:2px;}
.elec-warn .titre{font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;margin-bottom:5px;}

/* SCHÉMA INTERACTIF */
.schema-wrap{border:2px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px;}
.schema-ctrl{background:#f0f4f9;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border);}
.schema-ctrl-lbl{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;}
.vbadge{display:inline-flex;align-items:center;gap:5px;border:2px solid transparent;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;user-select:none;}
.vbadge.vim-b{background:var(--navy);color:#fff;}
.vbadge.vpi-b{background:#7a2d00;color:#fff;}
.vbadge.active{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange);}
.rot-btn{padding:4px 10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.rot-btn:hover{background:var(--navy);color:#fff;}
.rst-btn{padding:4px 10px;border:1.5px solid var(--red);background:#fff;color:var(--red);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.rst-btn:hover{background:var(--red);color:#fff;}
.schema-svg-wrap{position:relative;background:#e8eff7;}
.schema-svg-wrap svg{display:block;width:100%;height:auto;}
.vim-positions-bar{font-size:11px;padding:6px 10px;background:#fff;border-top:1px solid var(--border);min-height:28px;}

/* FICHE FORMATIVE */
.ff-wrap{border:2px solid var(--navy);border-radius:8px;overflow:hidden;margin-top:18px;}
.ff-hdr{background:var(--navy);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;}
.ff-hdr h3{font-size:13px;font-weight:700;color:#fff;}
.ff-hdr span{font-size:10px;color:rgba(255,255,255,.6);}
.ff-body{padding:13px;}
.ff-section{margin-bottom:13px;}
.ff-section-title{background:var(--gray);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:3px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.ff-interv{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px;}
.ff-interv th{background:#f0f0f0;padding:5px 8px;border:1px solid #ccc;font-size:10px;font-weight:700;color:var(--gray);text-align:center;}
.ff-interv td{border:1px solid #ccc;padding:5px 8px;vertical-align:top;}
.ff-interv .vim-hdr{background:var(--navy);color:#fff;text-align:center;font-weight:700;}
.ff-interv .vpi-hdr{background:#7a2d00;color:#fff;text-align:center;font-weight:700;}
.ff-interv input[type=text]{width:100%;border:none;outline:none;font-size:11px;background:transparent;font-family:inherit;}
.ff-checklist{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.ff-check-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border:1px solid #eee;border-radius:4px;background:#fafafa;font-size:12px;}
.ff-oui-non{display:flex;gap:10px;}
.ff-oui-non label{display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;}
.ff-attaque{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:13px;}
.ff-attaque-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border:1px solid #eee;border-radius:4px;background:#fafafa;}
.ff-attaque-item input{accent-color:var(--navy);}
.ff-gestion{width:100%;border-collapse:collapse;font-size:12px;}
.ff-gestion th{background:var(--navy);color:#fff;padding:5px 7px;font-size:10px;text-transform:uppercase;border:1px solid var(--navy);text-align:center;}
.ff-gestion td{border:1px solid #ddd;padding:5px 7px;}
.ff-gestion tr:nth-child(even) td{background:#f8f8f8;}
.ff-gestion .item-lbl{font-weight:500;}
.ff-gestion input[type=checkbox]{accent-color:var(--navy);width:14px;height:14px;}
.ff-obs{width:100%;border:1px solid #ddd;border-radius:5px;padding:7px;font-size:12px;resize:vertical;min-height:50px;font-family:inherit;margin-top:6px;}
.ff-radio-grp{display:flex;gap:12px;}
.ff-radio-grp label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;}

/* LOCAL PERSO */
.local-input-row{display:flex;gap:7px;margin-top:8px;}
.local-input-row input{flex:1;padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;}
.local-input-row button{padding:6px 12px;background:var(--navy);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;}

@media print{.app-header,.panel,.no-print{display:none!important;}.app-body{display:block;padding:0;}.fiche-wrap{border:none;border-radius:0;}body{background:#fff;}}
@media(max-width:820px){.app-body{grid-template-columns:1fr;}.panel{position:static;}.ff-checklist,.tg2,.ff-attaque{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header class="app-header">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <h1>🔥 RFFS BOD — Incendie Terrestre</h1>
      <span>Générateur de fiches d'exercice — Interventions bâtiments &amp; véhicules</span>
    </div>
    <div class="hdr-badge">
      <a href="index.html" class="btn-home">← Accueil</a>
    </div>
  </div>
</header>

<div class="app-body">

  <!-- PANNEAU GAUCHE -->
  <aside class="panel no-print">
    <div class="panel-title">🎯 Paramètres de l'exercice</div>
    <div class="panel-body">

      <!-- CATÉGORIE -->
      <div class="fg">
        <label>Catégorie</label>
        <div class="sw">
          <select id="categorie" onchange="updSousCat()">
            <option value="feu_batiment">🏢 Feu de bâtiment / local</option>
            <option value="feu_vehicule">🚗 Feu de véhicule</option>
            <option value="feu_infrastructure">⚡ Infrastructure technique</option>
            <option value="sauvetage">🚨 Sauvetage / urgence</option>
          </select>
        </div>
      </div>

      <!-- SOUS-CATÉGORIE -->
      <div class="fg">
        <label>Sous-catégorie / Thème</label>
        <div class="sw"><select id="sous_cat"></select></div>
      </div>

      <!-- LIEU DE MANŒUVRE -->
      <div class="fg">
        <label>Lieu de manœuvre</label>
        <div class="sw">
          <select id="lieu">
            <option>Jetée ibérique R+1</option>
            <option>Jetée ibérique (RDC)</option>
            <option>CBS Hall A</option>
            <option>CBS Hall B</option>
            <option>CBS Billi</option>
            <option>Livraison bagage Billi</option>
            <option>Centrale ANA</option>
            <option>Bâtiment servitude côté piste</option>
            <option>Sous-station clim côté piste</option>
            <option>Algeco EasyJet</option>
            <option>Local électrique</option>
            <option>Panneaux solaires</option>
          </select>
        </div>
        <!-- Ajout manuel -->
        <div class="local-input-row">
          <input type="text" id="lieu_custom" placeholder="Ajouter un local...">
          <button onclick="addLieu()">+ Ajouter</button>
        </div>
      </div>

      <!-- VÉHICULES -->
      <div class="fg">
        <label>Moyens engagés</label>
        <div class="tg">
          <input type="radio" name="veh" id="veh_vpi" value="vpi" onchange="autoAgents()"><label for="veh_vpi">VPI seul</label>
          <input type="radio" name="veh" id="veh_vpi_vim" value="vpi_vim" checked onchange="autoAgents()"><label for="veh_vpi_vim">VPI + VIM</label>
          <input type="radio" name="veh" id="veh_vim" value="vim" onchange="autoAgents()"><label for="veh_vim">VIMs seul</label>
        </div>
      </div>

      <div class="row2">
        <div class="fg">
          <label>Nb VIM</label>
          <div class="sw"><select id="nb_vim">
            <option value="1">1 VIM</option>
            <option value="2" selected>2 VIM</option>
            <option value="3">3 VIM</option>
          </select></div>
        </div>
        <div class="fg">
          <label>Agents</label>
          <input type="number" id="nb_agents" min="1" max="12" value="4">
        </div>
      </div>

      <!-- MODE -->
      <div class="fg">
        <label>Mode</label>
        <div class="tg">
          <input type="radio" name="mode" id="m_norm" value="normal" checked><label for="m_norm">Normal</label>
          <input type="radio" name="mode" id="m_alea" value="aleatoire"><label for="m_alea">Aléatoire</label>
        </div>
      </div>

      <div class="divider"></div>
      <button class="btn-gen" onclick="genFiche()">🔥 GÉNÉRER LA FICHE</button>
      <button class="btn-sec no-print" onclick="window.print()">🖨️ Imprimer</button>

    </div>
  </aside>

  <!-- ZONE FICHE -->
  <main>
    <div class="fiche-wrap" id="fiche-zone">
      <div class="placeholder">
        <div class="ico">🏢</div>
        <h3>Prêt à générer</h3>
        <p>Sélectionne la catégorie, le lieu et les moyens, puis clique sur <strong>Générer la fiche</strong>.</p>
      </div>
    </div>
  </main>

</div>

<script>
/* ═══════════════════════════════════════════════════════
   DONNÉES — THÈMES D'INTERVENTION
═══════════════════════════════════════════════════════ */
const CATS = {

    label: '🏢 Feu de bâtiment / local',
    themes: {
      feu_local_elec: {
        l: 'Feu local électrique',
        al: [

      },
      feu_poubelle: {

        ],
        q:'Localisation précise — Zone sécurisée ? — Évacuation déclenchée ? — Détecteur activé ?',

          {ti:'📋 Procédure',c:'nv',li:['Détection + alarme incendie activée ?','CR twR et chef de service','Mettre en veille détecteurs zone']},
          {ti:'🚿 Moyens',c:'nv',li:['Extincteur CO2 ou eau poudre','Lance brouillard si propagation','Contrôle 30 min après extinction']}
        ]
      },
      feu_faux_plafond: {
        l: 'Feu faux-plafond / gaine technique',
        al: [
          {t:'Détecteur de fumée activé en zone de faux-plafond.',b:1},
          {t:'Odeur de brûlé — source non visible.',i:1},
          {t:'Recherche active — zone délimitée. Intervenez.',b:1}
        ],
        q:'Zone du détecteur actif — Câblage proche ? — TGBT zone coupé ? — Accès faux-plafond identifié ?',

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
function updSousCat(){
  const cat = document.getElementById('categorie').value;
  const themes = CATS[cat].themes;
  document.getElementById('sous_cat').innerHTML = Object.keys(themes)
    .map(k=>`<option value="${k}">${themes[k].l}</option>`).join('');
  // Afficher/masquer le nb VIM selon mode
  const vehVal = document.querySelector('input[name="veh"]:checked').value;
  document.getElementById('nb_vim').parentElement.parentElement.style.display =
    vehVal === 'vpi' ? 'none' : '';
}

function addLieu(){
  const v = document.getElementById('lieu_custom').value.trim();
  if(!v) return;
  const sel = document.getElementById('lieu');
  const opt = document.createElement('option');
  opt.value = v; opt.textContent = v; opt.selected = true;
  sel.appendChild(opt);
  document.getElementById('lieu_custom').value = '';
}

function autoAgents(){
  const v = document.querySelector('input[name="veh"]:checked').value;
  const agentsEl = document.getElementById('nb_agents');
  const nbVimSel = parseInt(document.getElementById('nb_vim').value) || 1;
  if(v === 'vpi'){
    agentsEl.readOnly = false;
    agentsEl.style.background = '';
    agentsEl.style.color = '';
  } else {
    const agentsVim = nbVimSel * 2;
    agentsEl.value = v === 'vpi_vim' ? agentsVim + 2 : agentsVim;
    agentsEl.readOnly = true;
    agentsEl.style.background = '#f5f5f5';
    agentsEl.style.color = '#595959';
  }
  document.getElementById('nb_vim').parentElement.parentElement.style.display =
    v === 'vpi' ? 'none' : '';
}
// Recalculer si on change le nb de VIM
document.getElementById('nb_vim').addEventListener('change', autoAgents);

updSousCat();
autoAgents();

═══════════════════════════════════════════════════════ */
function genFiche(){
  const mode = document.querySelector('input[name="mode"]:checked').value;
  let catKey, themeKey;

  if(mode === 'aleatoire'){
    const cats = Object.keys(CATS);
    catKey = cats[Math.floor(Math.random()*cats.length)];
    const ths = Object.keys(CATS[catKey].themes);
    themeKey = ths[Math.floor(Math.random()*ths.length)];
    document.getElementById('categorie').value = catKey;
    updSousCat();
    document.getElementById('sous_cat').value = themeKey;
  } else {
    catKey = document.getElementById('categorie').value;
    themeKey = document.getElementById('sous_cat').value;
  }

  const th = CATS[catKey].themes[themeKey];
  const lieu = document.getElementById('lieu').value;
  const vehType = document.querySelector('input[name="veh"]:checked').value;
  const nbVim = vehType === 'vpi' ? 0 : parseInt(document.getElementById('nb_vim').value);
  const nbAgents = parseInt(document.getElementById('nb_agents').value);
  const now = new Date();
  const date = now.toLocaleDateString('fr-FR');
  const heure = now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('fiche-zone').innerHTML = buildFiche(th, lieu, vehType, nbVim, nbAgents, date, heure, catKey, themeKey);
  initSchema();
}

function getVehLabel(type, nbVim){
  if(type==='vpi') return '<span class="badge-vpi">VPI</span> (2 agents)';
  if(type==='vim') return `${nbVim}x <span class="badge-vim">VIM</span> (4 agents)`;
  return `<span class="badge-vpi">VPI</span> + ${nbVim}x <span class="badge-vim">VIM</span> (4 agents)`;
}

function buildFiche(th, lieu, vehType, nbVim, nbAgents, date, heure, catKey, themeKey){
  // Alerte
  const alertHTML = th.al.map(a=>`<p class="${a.b?'bd':''} ${a.i?'it':''}">${a.t}</p>`).join('');

  // Missions selon véhicules
  let missionRows = '';
  if(vehType==='vpi' || vehType==='vpi_vim'){
    missionRows += `<tr><td class="sl svpi">P</td><td class="slb"><span class="svpil">VPI</span></td><td class="sc">${th.moyens_vpi.join('<br>')}</td></tr>`;
  }
  if(vehType==='vim' || vehType==='vpi_vim'){
    const mims = th.moyens_vim;
    for(let i=0;i<Math.min(nbVim,mims.length);i++){
      missionRows += `<tr><td class="sl ss">${i+1}</td><td class="slb"><span class="ssl">VIM ${i+1}</span></td><td class="sc">${mims[i]}</td></tr>`;
    }
  }

  // Consignes de sécurité
  const secHTML = th.sec.map((s,i)=>`<tr><td class="sl ssec">${i+1}</td><td class="slb ssecl">SÉCURITÉ</td><td class="sc">${s}</td></tr>`).join('');

  // Tableaux conseils
  const tcHTML = `<div class="tg2">${th.tc.map(t=>`
    <div class="tc">
      <h4 style="color:${t.c==='red'?'var(--red)':'var(--navy)'}">${t.ti}</h4>
      <ul>${t.li.map(l=>`<li>${l}</li>`).join('')}</ul>
    </div>`).join('')}</div>`;

  // Alerte véhicule électrique
  const isElec = themeKey === 'feu_electrique';
  const elecWarn = isElec ? `
    <div class="elec-warn">
      <div class="titre">⚡ PROTOCOLE VÉHICULE ÉLECTRIQUE</div>
      <p>ARI obligatoire à l'approche — gaz HF, CO, oxydes d'azote.</p>

function initSchema(){
  selVehId = 'VPI';
  vehDirs = {};
  vehPositions = {};
  // Majuscule lieu dans schéma
  const lbl = document.getElementById('label-lieu-schema');
  if(lbl) lbl.textContent = document.getElementById('lieu').value;
  // Drag du foyer
  enableFeuDrag();
  // Activer premier badge
  const firstBadge = document.querySelector('.vbadge');
  if(firstBadge){
    selVehId = firstBadge.dataset.vid;
    firstBadge.classList.add('active');
  }
}

function selVeh(vid){
  selVehId = vid;
  document.querySelectorAll('.vbadge').forEach(b=>{
    b.classList.toggle('active', b.dataset.vid === vid);
  });
}

function rotateSel(){
  vehDirs[selVehId] = ((vehDirs[selVehId]||0) + 90) % 360;
  redrawVehMarker(selVehId);
}

function resetSchema(){
  // Supprimer tous les marqueurs
  document.querySelectorAll('[id^="marker-veh-"]').forEach(m=>m.remove());
  vehPositions = {};
  vehDirs = {};
  document.getElementById('veh-positions-bar').innerHTML =
    '<span style="color:var(--text-m);font-size:11px">Clique sur le plan pour placer les véhicules — fais glisser le 🔥 pour repositionner le foyer.</span>';
}

function placeVehSchema(evt){
  const svg = document.getElementById('svg-incendie');
  if(!svg) return;
  // Éviter clic sur marqueurs existants
  if(evt.target.closest && evt.target.closest('[id^="marker-veh-"]')) return;
  if(evt.target.id === 'feu-schema') return;
  const r = svg.getBoundingClientRect();
  const vbW = svg.viewBox.baseVal.width;
  const vbH = svg.viewBox.baseVal.height;
  const x = (evt.clientX - r.left)*(vbW/r.width);
  const y = (evt.clientY - r.top)*(vbH/r.height);
  placeVehAt(selVehId, x, y);
}

function placeVehAt(vid, x, y){
  vehPositions[vid] = {x,y};
  redrawVehMarker(vid);
  updatePosBar();
}

function redrawVehMarker(vid){
  const svg = document.getElementById('svg-incendie');
  if(!svg) return;
  const old = document.getElementById('marker-veh-'+vid);
  if(old) old.remove();

  const isVpi = vid === 'VPI';
  const color = isVpi ? '#7a2d00' : '#002F5F';
  const pos = vehPositions[vid];
  if(!pos) return;
  const angle = vehDirs[vid]||0;
  const sz = 52;
  const {x, y} = pos;

  // Créer groupe
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('id','marker-veh-'+vid);
  g.style.cursor='move';
  g.dataset.vid = vid;
  g.dataset.cx = x;
  g.dataset.cy = y;

  // SVG truck inline
  const cx = x, cy = y;
  const half = sz/2;
  // Transformations de rotation
  const trk = buildTruckSVG(vid, color, isVpi, cx, cy, half, angle);
  g.innerHTML = trk;
  svg.appendChild(g);
  enableVehDrag(g, vid);
}

function buildTruckSVG(vid, color, isVpi, cx, cy, half, angle){
  const label = vid;
  // Simple rectangle-camion avec label
  const w = half*2, h = half*1.1;
  const tx = cx - w/2, ty = cy - h/2;
  const rot = `rotate(${angle},${cx},${cy})`;
  return `
    <g transform="${rot}">
      <rect x="${tx}" y="${ty}" width="${w}" height="${h}" fill="${color}" rx="4" stroke="#fff" stroke-width="2"/>
      <rect x="${tx+2}" y="${ty+2}" width="${w*0.32}" height="${h-4}" fill="#1a1a1a" rx="2"/>
      <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central"
        font-family="Arial Black,sans-serif" font-size="${isVpi?10:11}" font-weight="900" fill="#fff">${label}</text>
    </g>`;
}

function enableVehDrag(g, vid){
  let dragging=false, sx=0, sy=0, scx=0, scy=0;
  function svgCoords(evt){
    const svg=document.getElementById('svg-incendie');
    const r=svg.getBoundingClientRect();
    const vbW=svg.viewBox.baseVal.width, vbH=svg.viewBox.baseVal.height;
    const cx=evt.touches?evt.touches[0].clientX:evt.clientX;
    const cy=evt.touches?evt.touches[0].clientY:evt.clientY;
    return{x:(cx-r.left)*(vbW/r.width),y:(cy-r.top)*(vbH/r.height)};
  }
  function onDown(e){
    e.preventDefault();e.stopPropagation();dragging=true;
    const p=svgCoords(e);sx=p.x;sy=p.y;
    scx=parseFloat(g.dataset.cx);scy=parseFloat(g.dataset.cy);
    g.style.opacity='0.7';
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);
  }
  function onMove(e){
    if(!dragging)return;e.preventDefault();
    const p=svgCoords(e);
    const nx=scx+(p.x-sx), ny=scy+(p.y-sy);
    g.dataset.cx=nx;g.dataset.cy=ny;
    vehPositions[vid]={x:nx,y:ny};
    redrawVehMarker(vid);
    updatePosBar();
  }
  function onUp(){
    dragging=false;g.style.opacity='1';
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);
  }
  g.addEventListener('mousedown',onDown);
  g.addEventListener('touchstart',onDown,{passive:false});
}

function enableFeuDrag(){
  const svg = document.getElementById('svg-incendie');
  if(!svg) return;
  const feu = document.getElementById('feu-schema');
  if(!feu) return;
  let dragging=false, sx=0, sy=0, scx=0, scy=0;
  function svgCoords(evt){
    const r=svg.getBoundingClientRect();
    const vbW=svg.viewBox.baseVal.width, vbH=svg.viewBox.baseVal.height;
    const cx=evt.touches?evt.touches[0].clientX:evt.clientX;
    const cy=evt.touches?evt.touches[0].clientY:evt.clientY;
    return{x:(cx-r.left)*(vbW/r.width),y:(cy-r.top)*(vbH/r.height)};
  }
  function onDown(e){e.preventDefault();e.stopPropagation();dragging=true;
    const p=svgCoords(e);sx=p.x;sy=p.y;
    scx=parseFloat(feu.getAttribute('cx'));scy=parseFloat(feu.getAttribute('cy'));
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);
  }
  function onMove(e){if(!dragging)return;e.preventDefault();
    const p=svgCoords(e);
    const nx=scx+(p.x-sx),ny=scy+(p.y-sy);
    feu.setAttribute('cx',nx);feu.setAttribute('cy',ny);
    // Texte feu
    const ft=feu.nextElementSibling;if(ft){ft.setAttribute('x',nx);ft.setAttribute('y',ny+4);}
  }
  function onUp(){dragging=false;
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);
  }
  feu.addEventListener('mousedown',onDown);
  feu.addEventListener('touchstart',onDown,{passive:false});
}

function updatePosBar(){
  const bar = document.getElementById('veh-positions-bar');
  if(!bar) return;
  const entries = Object.keys(vehPositions).map(vid=>{
    const isVpi = vid==='VPI';
    return `<span style="margin:0 5px;background:${isVpi?'#7a2d00':'var(--navy)'};color:#fff;padding:2px 8px;border-radius:10px;font-size:10px">${vid} → placé</span>`;
  });
  bar.innerHTML = entries.length ? entries.join('') : '<span style="color:var(--text-m);font-size:11px">Aucun véhicule placé</span>';
}

            <input type="radio" name="inc_resultat" value="à_revoir"> <span style="color:var(--amber);font-weight:700;">⚠ À REVOIR</span>

}

const SUPA_URL = 'https://swrjwiujatbbpmznaffc.supabase.co';
const SUPA_KEY = 'sb_publishable_NT3U2klv36FaOY2H-dujyw_3AO49Q0E';
const KEY_DATA_INC = 'rffs_incendie_fiches';

async function supabaseInsertInc(fiche) {
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/fiches', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        date:         fiche.date        || '',
        heure:        fiche.heure       || '',
        aeronef:      fiche.lieu        || '',   // réutilise le champ aeronef pour le lieu
        theme:        fiche.theme       || '',
        niveau:       0,
        conditions:   fiche.vehType    || '',    // réutilise conditions pour le type véhicule
        agents:       String(fiche.agents || ''),
        resultat:     fiche.resultat    || '',
        observations: fiche.observations|| '',
        source:       'Incendie'
      })
    });
    return res.ok;
  } catch(e) {
    console.warn('Supabase offline:', e.message);
    return false;
  }
}

async function saveIncendie() {
  // Récupérer le résultat sélectionné
  const resEl = document.querySelector('input[name="inc_resultat"]:checked');
  if(!resEl){
    showSaveError('Sélectionne un résultat avant d\'enregistrer.');
    return;
  }
  const resultat = resEl.value;
  const obs = (document.getElementById('obs-generale-inc') || {}).value || '';

  // Récupérer les paramètres depuis les sélecteurs du panneau
  const lieu      = document.getElementById('lieu').value;
  const sousCatEl = document.getElementById('sous_cat');
  const catEl     = document.getElementById('categorie');
  const catKey    = catEl ? catEl.value : '';
  const themeLabel = sousCatEl ? sousCatEl.options[sousCatEl.selectedIndex].text : '';
  const vehType   = document.querySelector('input[name="veh"]:checked').value;
  const nbAgents  = document.getElementById('nb_agents').value;

  const now   = new Date();
  const date  = now.toLocaleDateString('fr-FR');
  const heure = now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  const fiche = {
    id: Date.now(),
    date, heure,
    lieu,
    theme: themeLabel,
    vehType,
    agents: nbAgents,
    resultat,
    observations: obs
  };

  // LocalStorage
  const stored = JSON.parse(localStorage.getItem(KEY_DATA_INC) || '[]');
  stored.unshift(fiche);
  localStorage.setItem(KEY_DATA_INC, JSON.stringify(stored));

  // Supabase
  const ok = await supabaseInsertInc(fiche);

  // Feedback
  const confirm = document.getElementById('save-confirm-inc');
  const errEl   = document.getElementById('save-error-inc');
  if(confirm){
    confirm.style.display = 'block';
    confirm.textContent = ok
      ? '✓ Fiche enregistrée et synchronisée !'
      : '✓ Fiche enregistrée localement (sync offline)';
    setTimeout(()=>{ confirm.style.display='none'; }, 4000);
  }
  if(errEl) errEl.style.display = 'none';
}

function showSaveError(msg){
  const errEl = document.getElementById('save-error-inc');
  if(errEl){ errEl.textContent = msg; errEl.style.display='block'; }
}
</script>
